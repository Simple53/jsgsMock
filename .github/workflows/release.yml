name: Build Multi-Platform Releases and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 v1.4.6)'
        required: true
        default: 'v1.4.6'

permissions:
  contents: write

jobs:
  # ==========================================================
  # 1. 桌面端构建: Windows x64 (.exe / NSIS)
  # ==========================================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer (NSIS)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: dist/*.exe

  # ==========================================================
  # 2. 桌面端构建: macOS arm64 + x64 (.dmg)
  # ==========================================================
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build macOS DMG (Universal arm64 and x64)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: dist/*.dmg

  # ==========================================================
  # 3. 桌面端构建: Linux x64 (.AppImage)
  # ==========================================================
  build-linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install Dependencies
        run: npm install

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: dist/*.AppImage

  # ==========================================================
  # 4. 移动端构建: Android (.apk)
  # ==========================================================
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Web Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r web/* android/app/src/main/assets/web/
          ls -la android/app/src/main/assets/web/

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon

      - name: Organize APK Artifact
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          cp "$APK_PATH" "jsgsMock-${{ env.RELEASE_VERSION }}.apk"
          ls -lh "jsgsMock-${{ env.RELEASE_VERSION }}.apk"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsgsMock-android-apk
          path: jsgsMock-*.apk

  # ==========================================================
  # 5. 移动端构建: iOS (.ipa & 可选 TestFlight 自动上传)
  # ==========================================================
  build-ipa:
    name: Build iOS IPA & TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Prepare Web Assets for iOS Bundle
        run: |
          mkdir -p ios/JsgsMock/web
          cp -r web/* ios/JsgsMock/web/
          ls -la ios/JsgsMock/web/

      - name: Generate Xcode Project with XcodeGen
        working-directory: ios
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build iOS App Bundle
        working-directory: ios
        run: |
          xcodebuild -project JsgsMock.xcodeproj \
            -scheme JsgsMock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA Archive
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "JsgsMock.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/JsgsMock.app
          zip -qry "jsgsMock-${{ env.RELEASE_VERSION }}-ios.ipa" Payload
          ls -lh "jsgsMock-${{ env.RELEASE_VERSION }}-ios.ipa"

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsgsMock-ios-ipa
          path: jsgsMock-*-ios.ipa

      - name: Optional Upload to TestFlight (if Apple API Key provided)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            echo "检测到 App Store Connect 凭据，正在上传至 TestFlight..."
            mkdir -p ~/.private_keys
            echo "$APPLE_API_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
            xcrun altool --upload-app \
              --type ios \
              --file "jsgsMock-${{ env.RELEASE_VERSION }}-ios.ipa" \
              --apiKey "$APPLE_API_KEY_ID" \
              --apiIssuer "$APPLE_API_ISSUER"
          else
            echo "未配置 App Store Connect 密钥，跳过 TestFlight 自动上传"
          fi

  # ==========================================================
  # 6. 统一汇聚所有平台安装包并发布到 GitHub Releases
  # ==========================================================
  publish-release:
    name: Publish All Platform Releases
    needs: [build-windows, build-macos, build-linux, build-apk, build-ipa]
    runs-on: ubuntu-latest
    steps:
      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Artifacts to Publish
        run: |
          ls -lh release-assets/

      - name: Create Multi-Platform GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: jsgsMock ${{ env.RELEASE_VERSION }} - 全平台安装包 (Windows / macOS / Linux / Android / iOS)
          draft: false
          prerelease: false
          files: |
            release-assets/*
          body: |
            ## jsgsMock ${{ env.RELEASE_VERSION }} 全平台正式版本发布

            本版本提供针对 **Windows、macOS、Linux、Android 和 iOS** 的全平台原生安装包。离线真题库、考点精要讲义手册全部内置，支持纯离线秒开刷题，并在连接网络时可顺畅在线流式观看 123 节名师精讲视频。

            ### 💻 桌面端安装包
            - **Windows (x64)**：下载 **`jsgsMock Setup *.exe`**（标准 NSIS 安装包，支持创建桌面快捷方式与自由选择安装目录）。
            - **macOS (Apple Silicon & Intel)**：下载 **`jsgsMock-*.dmg`**（通用架构，拖拽直接安装）。
            - **Linux (x64)**：下载 **`jsgsMock-*.AppImage`**（免安装，赋予执行权限后直接运行）。

            ### 📱 移动端安装包
            - **Android 手机/平板**：下载 **`jsgsMock-${{ env.RELEASE_VERSION }}.apk`** 直接安装。已彻底修复内置安全域映射，即装即用。
            - **Apple iOS (iPhone / iPad)**：
              - **方式一（.ipa 侧载签名）**：下载 **`jsgsMock-${{ env.RELEASE_VERSION }}-ios.ipa`**，使用 爱思助手 / Sideloadly / AltStore / TrollStore 安装。
              - **方式二（Safari 免签安装）**：使用 iPhone/iPad 自带 Safari 浏览器打开 [https://simple53.github.io/jsgsMock/](https://simple53.github.io/jsgsMock/)，点击底部分享按钮 -> 选择「添加到主屏幕」即可作为独立全屏 App 运行。
              - **方式三（TestFlight）**：若配置了 App Store Connect 证书凭据，将自动同步推送到 TestFlight 测试通道。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
