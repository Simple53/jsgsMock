name: Build Android APK and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 v1.2.1)'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Web Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r web/* android/app/src/main/assets/web/
          ls -la android/app/src/main/assets/web/

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon

      - name: Organize APK Artifact
        run: |
          find android/app/build/outputs/apk/ -name "*.apk"
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "file2quiz-${{ env.RELEASE_VERSION }}.apk"
          ls -lh file2quiz-${{ env.RELEASE_VERSION }}.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: file2quiz-${{ env.RELEASE_VERSION }}
          path: file2quiz-${{ env.RELEASE_VERSION }}.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: file2quiz ${{ env.RELEASE_VERSION }} - 智能刷题与抗遗忘 (含安卓APK)
          draft: false
          prerelease: false
          files: file2quiz-${{ env.RELEASE_VERSION }}.apk
          body: |
            ## 🚀 file2quiz ${{ env.RELEASE_VERSION }} 正式发布

            本版本支持作为**原生 Android APK 独立应用**运行，无需依赖浏览器即可离线秒开刷题！

            ### 📱 安卓客户端直接下载安装
            - 下载下方 Assets 中的 **`file2quiz-${{ env.RELEASE_VERSION }}.apk`** 即可在安卓手机或平板直接安装。
            - **离线运行**：全部真题库与权威讲义均已打包内置，断网也能秒开刷题。
            - **全屏沉浸体验**：原生全屏无边框，自适应软键盘与防误触双击返回退出。

            ### ✨ 核心功能升级
            1. **AI 助教深入追问与对话编辑**：
               - 支持单条用户输入一键【复制】与【修改并重试】（全新精美 SVG 图形按钮）；
               - 智能清洗多轮对话序列，根治 HTTP 400 网络错误；
            2. **错题本与收藏体系深度融合**：
               - 错题本新增【我的收藏】专属栏目；
               - 收藏题目全面接入艾宾浩斯抗遗忘记忆曲线（支持【记得】、【模糊】、【忘记】三维即时反馈）；
               - 错题与收藏做题模式拒绝提前泄露答案，真实还原考场体验；
            3. **断点继续练习**：
               - 点击已开启科目自动从上次做题中断处精准恢复，原题组与题号完整保留；
            4. **多端双向同步**：
               - 支持 GitHub Gist 云端免服同步与局域网热点同步，手机电脑随时随地互通。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
