name: Build Android APK & iOS IPA and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 v1.4.3)'
        required: true
        default: 'v1.4.3'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Web Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r web/* android/app/src/main/assets/web/
          ls -la android/app/src/main/assets/web/

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon

      - name: Organize APK Artifact
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          cp "$APK_PATH" "jsgsMock-${{ env.RELEASE_VERSION }}.apk"
          ls -lh "jsgsMock-${{ env.RELEASE_VERSION }}.apk"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsgsMock-android-apk
          path: jsgsMock-*.apk

  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Prepare Web Assets for iOS Bundle
        run: |
          mkdir -p ios/JsgsMock/web
          cp -r web/* ios/JsgsMock/web/
          ls -la ios/JsgsMock/web/

      - name: Generate Xcode Project with XcodeGen
        working-directory: ios
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build Unsigned iOS App Bundle
        working-directory: ios
        run: |
          xcodebuild -project JsgsMock.xcodeproj \
            -scheme JsgsMock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA Archive
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "JsgsMock.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/JsgsMock.app
          zip -qry "jsgsMock-${{ env.RELEASE_VERSION }}-ios.ipa" Payload
          ls -lh "jsgsMock-${{ env.RELEASE_VERSION }}-ios.ipa"

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsgsMock-ios-ipa
          path: jsgsMock-*-ios.ipa

  publish-release:
    name: Publish GitHub Release
    needs: [build-apk, build-ipa]
    runs-on: ubuntu-latest

    steps:
      - name: Set Release Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: jsgsMock-android-apk

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: jsgsMock-ios-ipa

      - name: Create GitHub Release with Android APK & iOS IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: jsgsMock ${{ env.RELEASE_VERSION }} - 智能刷题与名师视频 (含 Android APK & iOS IPA)
          draft: false
          prerelease: false
          files: |
            jsgsMock-${{ env.RELEASE_VERSION }}.apk
            jsgsMock-${{ env.RELEASE_VERSION }}-ios.ipa
          body: |
            ## jsgsMock ${{ env.RELEASE_VERSION }} 正式发布

            本版本同时提供 **Android 原生安装包 (`.apk`)** 与 **Apple iOS 原生安装包 (`-ios.ipa`)**。全套真题库与考点精要讲义均已内置于安装包中，支持**纯离线秒开刷题**，并在**连接网络时直接在线观看 123 节名师精讲视频**。

            ### 1. Android 客户端安装
            - 下载下方 Assets 中的 **`jsgsMock-${{ env.RELEASE_VERSION }}.apk`** 在安卓手机或平板直接安装。

            ### 2. Apple iOS (iPhone / iPad) 客户端安装
            - **方式一（离线 `.ipa` 安装包侧载）**：下载下方 Assets 中的 **`jsgsMock-${{ env.RELEASE_VERSION }}-ios.ipa`**，使用 **Sideloadly**、**AltStore / SideStore**、**爱思助手** 或 **TrollStore（巨魔商店）** 签名安装至 iPhone / iPad。
            - **方式二（Safari 免签桌面安装）**：使用 iPhone / iPad 自带 Safari 浏览器打开 [https://simple53.github.io/jsgsMock/](https://simple53.github.io/jsgsMock/)，点击底部「分享」按钮 -> 选择「添加到主屏幕」，即可作为独立全屏 App 运行。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
