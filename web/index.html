<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>笃学题库 - 考点智能刷题与AI解析</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <style>
    /* =========================================
       粉笔风格·纯扁平·无阴影·无渐变·无Emoji设计体系
       ========================================= */
    :root {
      --primary: #2563eb;         /* 粉笔蓝 */
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --correct: #10b981;         /* 纯扁平翡翠绿 */
      --correct-bg: #ecfdf5;
      --wrong: #ef4444;           /* 纯扁平珊瑚红 */
      --wrong-bg: #fef2f2;
      --star-active: #f59e0b;     /* 星级明黄 */
      --star-inactive: #e2e8f0;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    /* 护眼模式主题 */
    body.theme-eye {
      --bg: #eef7ee;
      --card-bg: #f7fcf7;
      --text-main: #143818;
      --text-sub: #3d6842;
      --border: #c8e6c9;
      --primary: #15803d;
      --primary-light: #e8f5e9;
      --primary-border: #a5d6a7;
    }

    /* 深色模式主题 */
    body.theme-dark {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-light: #1e3a8a;
      --primary-border: #2563eb;
      --correct-bg: #064e3b;
      --wrong-bg: #7f1d1d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .svg-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* =========================================
       视图 1: 课程列表首页 (参考图 2)
       ========================================= */
    .home-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      padding-bottom: 72px;
    }
    .home-header {
      padding: 16px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
    }
    .home-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }
    .home-header-icons {
      display: flex;
      gap: 14px;
      color: var(--text-sub);
    }
    .header-icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    /* 顶部科目胶囊导航 */
    .capsule-nav {
      display: flex;
      gap: 12px;
      padding: 6px 20px 14px;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    .capsule-nav::-webkit-scrollbar {
      display: none;
    }
    .capsule-item {
      font-size: 14px;
      color: var(--text-sub);
      cursor: pointer;
      padding-bottom: 6px;
      font-weight: 500;
    }
    .capsule-item.active {
      color: var(--primary);
      font-weight: 700;
      border-bottom: 2.5px solid var(--primary);
    }

    /* 科目卡片列表 */
    .subject-list {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .subject-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .sub-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex: 1;
    }
    .sub-bullet-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .sub-bullet-circle svg {
      width: 12px;
      height: 12px;
    }
    .sub-info-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sub-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }
    .sub-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stars-group {
      display: flex;
      gap: 3px;
    }
    .star-icon {
      width: 13px;
      height: 13px;
      fill: var(--star-inactive);
    }
    .star-icon.active {
      fill: var(--star-active);
    }
    .sub-progress-count {
      font-size: 12px;
      color: var(--text-muted);
    }
    .sub-right-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
      padding-left: 8px;
    }

    /* 底部悬浮自定义刷题按钮 */
    .custom-fab-wrap {
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .custom-fab-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      color: var(--text-main);
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .custom-fab-btn:active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 底部导航栏 */
    .bottom-tabbar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 56px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 30;
    }
    .tabbar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      background: none;
      border: none;
    }
    .tabbar-item.active {
      color: var(--primary);
    }
    .tabbar-item svg {
      width: 20px;
      height: 20px;
    }

    /* =========================================
       视图 2: 刷题界面 (参考图 1)
       ========================================= */
    .quiz-view {
      display: none;
      flex-direction: column;
      flex: 1;
      height: 100vh;
      overflow-y: hidden;
    }
    .quiz-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      position: relative;
      z-index: 25;
    }
    .nav-left-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-icon-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .quiz-timer {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }
    .nav-right-tools {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text-main);
    }

    /* 更多选项下拉菜单 (纯扁平无阴影) */
    .more-dropdown {
      position: absolute;
      top: 50px;
      right: 16px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      display: none;
      flex-direction: column;
      z-index: 40;
      min-width: 140px;
    }
    .more-dropdown.open {
      display: flex;
    }
    .dropdown-item {
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dropdown-item:last-child {
      border-bottom: none;
    }
    .dropdown-item:active {
      background: var(--primary-light);
      color: var(--primary);
    }

    /* 题目题干区域 */
    .quiz-scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 76px;
    }
    .quiz-header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .meta-subject-tag {
      font-weight: 600;
      color: var(--text-sub);
    }
    .meta-index-counter {
      font-weight: 700;
      color: var(--text-sub);
    }
    .q-text-body {
      font-size: 17px;
      line-height: 1.65;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-word;
    }

    /* 选项列表 (参考图 1 圆形按钮) */
    .quiz-options-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .option-circle-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .option-label-text {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-main);
      flex: 1;
    }

    /* 选项状态 (做题模式 vs 背题模式) */
    .option-row.exam-selected {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .option-row.exam-selected .option-circle-letter {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .option-row.status-correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: #065f46;
    }
    .option-row.status-correct .option-circle-letter {
      border-color: var(--correct);
      background: var(--correct);
      color: #ffffff;
    }

    .option-row.status-wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: #991b1b;
    }
    .option-row.status-wrong .option-circle-letter {
      border-color: var(--wrong);
      background: var(--wrong);
      color: #ffffff;
    }

    /* 判断题操作组 */
    .judge-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .judge-flat-btn {
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* 官方解析展开折叠框 */
    .fenbi-analysis-box {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: var(--card-bg);
      margin-top: 10px;
    }
    .analysis-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .ans-badge-text {
      color: var(--correct);
      font-size: 16px;
      margin-left: 6px;
    }
    .analysis-detail-body {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-sub);
      white-space: pre-wrap;
    }

    /* AI 深度考点解析模块 */
    .ai-stream-box {
      border: 1.5px solid var(--primary-border);
      border-radius: 12px;
      padding: 14px;
      background: var(--card-bg);
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ai-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ai-label-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ai-trigger-btn {
      padding: 6px 14px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .ai-text-container {
      font-size: 14px;
      line-height: 1.7;
      background: var(--primary-light);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--primary-border);
      color: var(--text-main);
      white-space: pre-wrap;
    }

    /* 底部刷题切换栏 */
    .quiz-bottom-actions {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 56px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 25;
    }
    .bottom-btn {
      height: 40px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      padding: 0 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bottom-btn.primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* =========================================
       模态弹窗: 自定义刷题 (参考图 3)
       ========================================= */
    .modal-mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.45);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-mask.open {
      display: flex;
    }
    .modal-panel {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .modal-title-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      width: 100%;
    }
    .modal-main-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }
    .modal-sub-tip {
      font-size: 12px;
      color: var(--text-muted);
    }
    .modal-close-icon {
      position: absolute;
      right: 0;
      top: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* 选项组区块 */
    .setting-section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .setting-card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mode-select-card {
      padding: 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .mode-select-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .card-corner-triangle {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 24px solid var(--primary);
      border-left: 24px solid transparent;
    }
    .card-corner-check {
      display: none;
      position: absolute;
      top: 1px;
      right: 2px;
      width: 10px;
      height: 10px;
      fill: #ffffff;
    }
    .mode-select-card.active .card-corner-triangle,
    .mode-select-card.active .card-corner-check {
      display: block;
    }
    .mode-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .mode-select-card.active .mode-card-title {
      color: var(--primary);
    }
    .mode-card-desc {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* 题量选择胶囊组 */
    .count-pills-row {
      display: flex;
      gap: 10px;
    }
    .count-pill {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-sub);
      cursor: pointer;
    }
    .count-pill.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }

    /* 遗忘曲线强化勾选 */
    .ebbinghaus-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
    }
    .ebbinghaus-toggle-row.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .toggle-info-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toggle-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }
    .toggle-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .modal-submit-btn {
      padding: 14px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      margin-top: 6px;
    }

    /* =========================================
       草稿画板全屏浮层
       ========================================= */
    .draft-canvas-mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 120;
      display: none;
      background: rgba(255, 255, 255, 0.85);
      touch-action: none;
    }
    .draft-canvas-mask.open {
      display: block;
    }
    #draftCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .draft-bar-float {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 30px;
      padding: 6px 14px;
      z-index: 130;
    }
    .draft-action-btn {
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .draft-action-btn.danger {
      color: var(--wrong);
    }

    /* =========================================
       答题卡网格抽屉
       ========================================= */
    .sheet-drawer-mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.45);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-drawer-mask.open {
      display: flex;
    }
    .sheet-drawer-content {
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sheet-num-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-top: 14px;
      padding-bottom: 20px;

    .sheet-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
    }
    .sheet-cell.current {
      border-color: var(--primary);
      border-width: 2px;
      color: var(--primary);
      background: var(--primary-light);
    }
    .sheet-cell.done {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .sheet-cell.correct {
      background: var(--correct);
      border-color: var(--correct);
      color: #ffffff;
    }
    .sheet-cell.wrong {
      background: var(--wrong);
      border-color: var(--wrong);
      color: #ffffff;
    }

    /* 交卷成绩卡片 */
    .score-summary-box {
      border: 1.5px solid var(--primary-border);

    }
    .score-label {
      font-size: 12px;
      color: var(--text-sub);
    }
  </style>
</head>

  <script>
    // ==========================================
    // 全局状态管理 (LocalStorage 本地持久化)
    // ==========================================
    let allSubjectsData = {};
    let currentSubject = "";
    let activeQuestions = [];
    let currentQuizIndex = 0;

    // 自定义配置状态
    let appConfig = {
      quizMode: 'study', // 'study' (背题) | 'exam' (做题)
      batchSize: 15,     // 5, 10, 15, 20, 0(不限)
      useEbbinghaus: false,
      theme: 'light'     // 'light' | 'eye' | 'dark'
    };

    // 用户进度数据与艾宾浩斯复习记录
    let userStore = {
      lastSubject: "",
      progress: {},      // { [subject]: lastIndex }
      answers: {},       // { [qKey]: { chosen: 'A', isCorrect: true, time: timestamp } }
      favorites: [],     // [qKey, ...]
      ebbinghausWrong: {}, // { [qKey]: { firstWrongAt, lastReviewAt, reviewCount } }
      aiCache: {},       // { [qKey]: text }
      settings: {
        baseUrl: "https://api.deepseek.com/v1",
        apiKey: "",
        model: "deepseek-chat"
      }
    };

    let isExamSubmitted = false; // 做题模式是否已交卷
    let timerSeconds = 0;
    let timerInterval = null;

    function getQKey(q) {
      return `${q.subject}_${q.type}_${q.num}`;
    }

    function loadUserStore() {
      const saved = localStorage.getItem("duxue_quiz_store");
      if (saved) {
        try {
          userStore = { ...userStore, ...JSON.parse(saved) };
        } catch (e) {}
      }
      const savedCfg = localStorage.getItem("duxue_quiz_cfg");
      if (savedCfg) {
        try {
          appConfig = { ...appConfig, ...JSON.parse(savedCfg) };
        } catch (e) {}
      }
      applyTheme(appConfig.theme);
    }

    function saveUserStore() {
      localStorage.setItem("duxue_quiz_store", JSON.stringify(userStore));
      localStorage.setItem("duxue_quiz_cfg", JSON.stringify(appConfig));
    }

    // ==========================================
    // 初始化应用与数据
    // ==========================================
    async function init() {
      loadUserStore();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      try {
        const resp = await fetch("quiz_data.json");
        allSubjectsData = await resp.json();
      } catch (e) {
        console.error("加载数据失败", e);
      }

      renderSubjectList();
      initDraftCanvas();
    }

    // ==========================================
    // 视图 1: 渲染课程列表 (掌握度星级计算)
    // ==========================================
    function renderSubjectList(filter = 'all') {
      const container = document.getElementById("subjectListContainer");
      container.innerHTML = "";

      const subjects = Object.keys(allSubjectsData);
      subjects.forEach((sub) => {
        if (filter === 'theory' && !sub.includes("学") && !sub.includes("论述")) return;
        if (filter === 'law' && !sub.includes("道德") && !sub.includes("法规")) return;

        const qList = allSubjectsData[sub] || [];
        const total = qList.length;

        // 计算用户已做数与正确率（计算星级）
        let answeredCount = 0;
        let correctCount = 0;
        qList.forEach(q => {
          const rec = userStore.answers[getQKey(q)];
          if (rec) {
            answeredCount++;
            if (rec.isCorrect) correctCount++;
          }
        });

        // 星级计算逻辑 (0~5 星)
        let starLevel = 0;
        if (answeredCount > 0) {
          const rate = correctCount / answeredCount;
          if (rate >= 0.9) starLevel = 5;
          else if (rate >= 0.75) starLevel = 4;
          else if (rate >= 0.6) starLevel = 3;
          else if (rate >= 0.4) starLevel = 2;
          else starLevel = 1;
        }

        let starsHtml = "";
        for (let i = 1; i <= 5; i++) {
          starsHtml += `<svg class="star-icon ${i <= starLevel ? 'active' : ''}"><use href="#icon-star"/></svg>`;
        }

        const card = document.createElement("div");
        card.className = "subject-card";
        card.innerHTML = `
          <div class="sub-left">
            <div class="sub-bullet-circle">
              <svg><use href="#icon-check"/></svg>
            </div>
            <div class="sub-info-col">
              <div class="sub-name">${sub}</div>
              <div class="sub-meta-row">
                <div class="stars-group">${starsHtml}</div>
                <span class="sub-progress-count">${answeredCount}/${total}</span>
              </div>
            </div>
          </div>
          <div class="sub-right-btn" onclick="startQuizSubject('${sub}', event)">
            <span>继续上次</span>
            <span>›</span>
          </div>
        `;
        card.onclick = () => startQuizSubject(sub);
        container.appendChild(card);
      });
    }

    function filterCategory(cat, elem) {
      document.querySelectorAll(".capsule-item").forEach(el => el.classList.remove("active"));
      elem.classList.add("active");
      renderSubjectList(cat);
    }

    // ==========================================
    // 启动刷题 (做题 / 背题 / 艾宾浩斯抽取)
    // ==========================================
    function startQuizSubject(sub, evt) {
      if (evt) evt.stopPropagation();
      currentSubject = sub;
      userStore.lastSubject = sub;

      const fullList = allSubjectsData[sub] || [];
      let pool = [...fullList];

      // 若启用了艾宾浩斯强化：按遗忘曲线筛选出待复习错题
      if (appConfig.useEbbinghaus) {
        const now = Date.now();
        pool = pool.filter(q => {
          const eb = userStore.ebbinghausWrong[getQKey(q)];
          if (!eb) return false;
          const hours = (now - eb.lastReviewAt) / (3600 * 1000);
          return hours >= 12; // 超过 12 小时即进入艾宾浩斯复习窗口
        });
        if (pool.length === 0) {
          alert("太棒了！该科目暂无需要复习的艾宾浩斯错题，为你调入正常题组。");
          pool = [...fullList];
        }
      }

      // 按 batchSize 截取题目
      if (appConfig.batchSize > 0 && pool.length > appConfig.batchSize) {
        const lastIdx = userStore.progress[sub] || 0;
        let start = lastIdx;
        if (start + appConfig.batchSize > pool.length) start = 0;
        activeQuestions = pool.slice(start, start + appConfig.batchSize);
      } else {
        activeQuestions = pool;
      }

      currentQuizIndex = 0;
      isExamSubmitted = false;

      // 切换视图
      document.getElementById("homeView").style.display = "none";
      document.getElementById("quizView").style.display = "flex";

      startTimer();
      renderCurrentQuestion();
    }

    function exitQuizToHome() {
      stopTimer();
      saveUserStore();
      document.getElementById("quizView").style.display = "none";
      document.getElementById("homeView").style.display = "flex";
      renderSubjectList();
    }

    // 艾宾浩斯错题专练快速入口
    function startEbbinghausReview() {
      appConfig.useEbbinghaus = true;
      openCustomModal();
    }

    // ==========================================
    // 视图 2: 渲染当前做题卡片 (单选/多选/判断)
    // ==========================================
    function renderCurrentQuestion() {
      const container = document.getElementById("quizScrollBody");
      const q = activeQuestions[currentQuizIndex];
      const total = activeQuestions.length;

      if (!q) {
        container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-muted);">暂无题目</div>`;
        return;
      }

      const qKey = getQKey(q);
      const userAnsRec = userStore.answers[qKey];
      const isExam = (appConfig.quizMode === 'exam');
      // 是否展示答案解析：背题模式答题后展示，做题模式仅交卷后展示
      const showAnswer = isExam ? isExamSubmitted : (userAnsRec !== undefined);

      let optionsHtml = "";

      if (q.type === 'judge') {
        let yesClass = "judge-flat-btn";
        let noClass = "judge-flat-btn";
        if (userAnsRec) {
          if (showAnswer) {
            if (q.answer === '对') yesClass += " status-correct";
            else if (userAnsRec.chosen === '对') yesClass += " status-wrong";

            if (q.answer === '错') noClass += " status-correct";
            else if (userAnsRec.chosen === '错') noClass += " status-wrong";
          } else {
            if (userAnsRec.chosen === '对') yesClass += " exam-selected";
            if (userAnsRec.chosen === '错') noClass += " exam-selected";
          }
        }
        optionsHtml = `
          <div class="judge-btn-grid">
            <button class="${yesClass}" onclick="handleAnswerSelect('对')">
              <svg class="svg-icon"><use href="#icon-check"/></svg>
              <span>正确</span>
            </button>
            <button class="${noClass}" onclick="handleAnswerSelect('错')">
              <svg class="svg-icon"><use href="#icon-close"/></svg>
              <span>错误</span>
            </button>
          </div>
        `;
      } else {
        optionsHtml = `<div class="quiz-options-col">`;
        for (const [letter, text] of Object.entries(q.options || {})) {
          let rowClass = "option-row";
          if (userAnsRec) {
            if (showAnswer) {
              if (q.answer.includes(letter)) {
                rowClass += " status-correct";
              } else if (userAnsRec.chosen.includes(letter)) {
                rowClass += " status-wrong";
              }
            } else {
              if (userAnsRec.chosen.includes(letter)) {
                rowClass += " exam-selected";
              }
            }
          }
          optionsHtml += `
            <div class="${rowClass}" onclick="handleAnswerSelect('${letter}')">
              <div class="option-circle-letter">${letter}</div>
              <div class="option-label-text">${text}</div>
            </div>
          `;
        }
        optionsHtml += `</div>`;
      }

      // 官方解析块 (带折叠)
      let analysisBlock = "";
      if (showAnswer) {
        analysisBlock = `
          <div class="fenbi-analysis-box">
            <div class="analysis-row-top" onclick="toggleAnalysisDetails('${qKey}')">
              <div>
                <span>正确答案</span>
                <span class="ans-badge-text">${q.answer}</span>
              </div>
              <span style="font-size:12px;color:var(--primary);">官方考点精解 ▾</span>
            </div>
            <div class="analysis-detail-body" id="analysisDetail_${qKey}">
              ${q.analysis || '本题暂无拓展官方考点解析'}
            </div>
          </div>

          <!-- AI 深度剖析组件 -->
          <div class="ai-stream-box">
            <div class="ai-header-bar">
              <div class="ai-label-title">
                <svg class="svg-icon" style="width:16px;height:16px;"><use href="#icon-gear"/></svg>
                <span>AI 名师深度剖析</span>
              </div>
              <button class="ai-trigger-btn" onclick="requestAiHelp()">
                ${userStore.aiCache[qKey] ? '重新精讲' : '一键精讲'}
              </button>
            </div>
            <div class="ai-text-container" id="aiTextContainer" style="${userStore.aiCache[qKey] ? '' : 'display:none;'}">
              ${userStore.aiCache[qKey] || ''}
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="quiz-header-meta">
          <span class="meta-subject-tag">${q.typeName} · ${q.subject}</span>
          <span class="meta-index-counter">${currentQuizIndex + 1} / ${total}</span>
        </div>
        <div class="q-text-body">${q.question}</div>
        ${optionsHtml}
        ${analysisBlock}
      `;

      container.scrollTop = 0;

      // 更新收藏与下一题按钮文字
      const isFav = userStore.favorites.includes(qKey);
      document.getElementById("favMenuText").textContent = isFav ? "取消收藏" : "收藏此题";

      const nextBtn = document.getElementById("nextActionBtn");
      if (currentQuizIndex === total - 1) {
        nextBtn.textContent = (isExam && !isExamSubmitted) ? "交卷查看" : "完成";
      } else {
        nextBtn.textContent = "下一题";
      }
    }

    // ==========================================
    // 答题判定与艾宾浩斯更新
    // ==========================================
    function handleAnswerSelect(ans) {
      const q = activeQuestions[currentQuizIndex];
      const qKey = getQKey(q);

      // 做题模式允许修改；背题模式做完后锁定
      if (appConfig.quizMode === 'study' && userStore.answers[qKey]) return;

      const isCorrect = (ans === q.answer);
      userStore.answers[qKey] = {
        chosen: ans,
        isCorrect: isCorrect,
        time: Date.now()
      };

      // 维护艾宾浩斯遗忘曲线记录
      if (!isCorrect) {
        const now = Date.now();
        if (!userStore.ebbinghausWrong[qKey]) {
          userStore.ebbinghausWrong[qKey] = {
            firstWrongAt: now,
            lastReviewAt: now,
            reviewCount: 0
          };
        } else {
          userStore.ebbinghausWrong[qKey].lastReviewAt = now;
          userStore.ebbinghausWrong[qKey].reviewCount += 1;
        }
      }

      saveUserStore();
      renderCurrentQuestion();
    }

    function navigateQuestion(step) {
      const total = activeQuestions.length;
      const target = currentQuizIndex + step;

      if (target >= total) {
        if (appConfig.quizMode === 'exam' && !isExamSubmitted) {
          submitExamPaper();
        } else {
          openSheetDrawer();
        }
        return;
      }

      if (target >= 0 && target < total) {
        currentQuizIndex = target;
        userStore.progress[currentSubject] = currentQuizIndex;
        saveUserStore();
        renderCurrentQuestion();
      }
    }

    function toggleAnalysisDetails(qKey) {
      const el = document.getElementById(`analysisDetail_${qKey}`);
      if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    }

    function resetCurrentQuestionAnswer() {
      const q = activeQuestions[currentQuizIndex];
      if (!q) return;
      delete userStore.answers[getQKey(q)];
      saveUserStore();
      renderCurrentQuestion();
      closeMoreDropdown();
    }

    // ==========================================
    // 做题模式交卷结算
    // ==========================================
    function submitExamPaper() {
      isExamSubmitted = true;
      closeSheetDrawer();
      renderCurrentQuestion();

      // 计算得分
      let correct = 0;
      activeQuestions.forEach(q => {
        const rec = userStore.answers[getQKey(q)];
        if (rec && rec.isCorrect) correct++;
      });
      const total = activeQuestions.length;
      const score = Math.round((correct / total) * 100);

      alert(`交卷成功！\n共 ${total} 题，答对 ${correct} 题，得分：${score} 分。\n已为您切换为全卷解析模式！`);
    }

    // ==========================================
    // 答题卡抽屉
    // ==========================================
    function openSheetDrawer() {
      const grid = document.getElementById("sheetNumGrid");
      grid.innerHTML = "";

      let correct = 0;
      let answered = 0;

      activeQuestions.forEach((q, idx) => {
        const qKey = getQKey(q);
        const rec = userStore.answers[qKey];
        const cell = document.createElement("div");
        cell.className = "sheet-cell";
        cell.textContent = idx + 1;

        if (idx === currentQuizIndex) cell.classList.add("current");

        if (rec) {
          answered++;
          if (appConfig.quizMode === 'exam' && !isExamSubmitted) {
            cell.classList.add("done");
          } else {
            if (rec.isCorrect) {
              cell.classList.add("correct");
              correct++;
            } else {
              cell.classList.add("wrong");
            }
          }
        }

        cell.onclick = () => {
          currentQuizIndex = idx;
          closeSheetDrawer();
          renderCurrentQuestion();
        };
        grid.appendChild(cell);
      });

      // 做题模式显示交卷按钮
      const submitBtn = document.getElementById("submitExamBtn");
      if (appConfig.quizMode === 'exam' && !isExamSubmitted) {
        submitBtn.style.display = "block";
      } else {
        submitBtn.style.display = "none";
      }

      document.getElementById("sheetDrawer").classList.add("open");
    }

    function closeSheetDrawer() {
      document.getElementById("sheetDrawer").classList.remove("open");
    }

    // ==========================================
    // 草稿纸功能 (Canvas 手写涂鸦)
    // ==========================================
    let draftCanvas, draftCtx, isDrawing = false;

    function initDraftCanvas() {
      draftCanvas = document.getElementById("draftCanvas");
      draftCtx = draftCanvas.getContext("2d");

      function resize() {
        draftCanvas.width = window.innerWidth;
        draftCanvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      function getPos(e) {
        const rect = draftCanvas.getBoundingClientRect();
        const touch = e.touches ? e.touches[0] : e;
        return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
      }

      function start(e) {
        isDrawing = true;
        const p = getPos(e);
        draftCtx.beginPath();
        draftCtx.moveTo(p.x, p.y);
      }
      function draw(e) {
        if (!isDrawing) return;
        const p = getPos(e);
        draftCtx.lineWidth = 2.5;
        draftCtx.lineCap = 'round';
        draftCtx.strokeStyle = '#2563eb';
        draftCtx.lineTo(p.x, p.y);
        draftCtx.stroke();
      }
      function stop() { isDrawing = false; }

      draftCanvas.addEventListener("mousedown", start);
      draftCanvas.addEventListener("mousemove", draw);
      draftCanvas.addEventListener("mouseup", stop);

      draftCanvas.addEventListener("touchstart", (e) => { e.preventDefault(); start(e); });
      draftCanvas.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); });
      draftCanvas.addEventListener("touchend", stop);
    }

    function openDraftCanvas() {
      document.getElementById("draftCanvasMask").classList.add("open");
    }
    function closeDraftCanvas() {
      document.getElementById("draftCanvasMask").classList.remove("open");
    }
    function clearDraft() {
      draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
    }

    // ==========================================
    // 计时器控制
    // ==========================================
    function startTimer() {
      stopTimer();
      timerSeconds = 0;
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById("quizTimer").textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    // ==========================================
    // 更多菜单与主题切换
    // ==========================================
    function toggleMoreDropdown(e) {
      e.stopPropagation();
      document.getElementById("moreDropdown").classList.toggle("open");
    }
    function closeMoreDropdown() {
      document.getElementById("moreDropdown").classList.remove("open");
    }
    window.addEventListener("click", () => closeMoreDropdown());

    function toggleFavoriteCurrent() {
      const q = activeQuestions[currentQuizIndex];
      if (!q) return;
      const qKey = getQKey(q);
      const idx = userStore.favorites.indexOf(qKey);
      if (idx >= 0) {
        userStore.favorites.splice(idx, 1);
      } else {
        userStore.favorites.push(qKey);
      }
      saveUserStore();
      renderCurrentQuestion();
      closeMoreDropdown();
    }

    function cycleThemeMode() {
      const themes = ['light', 'eye', 'dark'];
      let nextIdx = (themes.indexOf(appConfig.theme) + 1) % themes.length;
      appConfig.theme = themes[nextIdx];
      applyTheme(appConfig.theme);
      saveUserStore();
      closeMoreDropdown();
    }

    function applyTheme(theme) {
      document.body.className = '';
      if (theme === 'eye') document.body.classList.add('theme-eye');
      if (theme === 'dark') document.body.classList.add('theme-dark');
    }

    function togglePinMode() {
      const icon = document.getElementById("pinIcon");
      const isPinned = icon.style.color === "var(--primary)";
      icon.style.color = isPinned ? "inherit" : "var(--primary)";
      alert(isPinned ? "已取消固定题号" : "已固定当前做题进度");
    }

    // ==========================================
    // 自定义模态框操作 (参考图 3)
    // ==========================================
    function openCustomModal() {
      selectQuizMode(appConfig.quizMode);
      document.querySelectorAll(".count-pill").forEach(p => {
        const val = parseInt(p.textContent) || 0;
        p.classList.toggle("active", val === appConfig.batchSize);
      });
      updateEbbinghausUI();
      document.getElementById("customModal").classList.add("open");
    }

    function closeCustomModal() {
      document.getElementById("customModal").classList.remove("open");
    }

    function selectQuizMode(mode) {
      appConfig.quizMode = mode;
      document.getElementById("cardModeExam").classList.toggle("active", mode === 'exam');
      document.getElementById("cardModeStudy").classList.toggle("active", mode === 'study');
    }

    function selectBatchSize(size, elem) {
      appConfig.batchSize = size;
      document.querySelectorAll(".count-pill").forEach(p => p.classList.remove("active"));
      elem.classList.add("active");
    }

    function toggleEbbinghausReview() {
      appConfig.useEbbinghaus = !appConfig.useEbbinghaus;
      updateEbbinghausUI();
    }

    function updateEbbinghausUI() {
      const row = document.getElementById("ebbinghausRow");
      const chk = document.getElementById("ebbinghausCheck");
      row.classList.toggle("active", appConfig.useEbbinghaus);
      chk.style.display = appConfig.useEbbinghaus ? "block" : "none";
    }

    function confirmStartCustomQuiz() {
      saveUserStore();
      closeCustomModal();
      const firstSub = currentSubject || Object.keys(allSubjectsData)[0];
      startQuizSubject(firstSub);
    }

    // ==========================================
    // AI 深度考点解析 (调用大模型流式输出)
    // ==========================================
    async function requestAiHelp() {
      const q = activeQuestions[currentQuizIndex];
      if (!q) return;
      const qKey = getQKey(q);

      const cfg = userStore.settings;
      if (!cfg.apiKey) {
        alert("请先配置您的 API Key (如 DeepSeek 密钥)");
        openSettingsModal();
        return;
      }

      const box = document.getElementById("aiTextContainer");
      box.style.display = "block";
      box.textContent = "正在连线名师 AI 梳理考点逻辑...";

      const prompt = `你是一位顶级教育学与公考名师。请对本题进行深度考点解析：
【科目】：${q.subject}
【题型】：${q.typeName}
【题干】：${q.question}
【官方正确答案】：${q.answer}
【官方原解析】：${q.analysis || '无'}

请严格按三部分简短输出：
1. 【考点本质】：直接点出考查的核心考点。
2. 【正解与混淆项排除】：精准说明为什么选 ${q.answer}，排除干扰项的关键点。
3. 【秒记口诀】：给出一句押韵或便于记忆的口诀。`;

      try {
        const endpoint = `${cfg.baseUrl.replace(/\/+$/, "")}/chat/completions`;
        const resp = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${cfg.apiKey}`
          },
          body: JSON.stringify({
            model: cfg.model || "deepseek-chat",
            messages: [
              { role: "system", content: "你是一位专业教育辅导专家，输出内容直击核心，拒绝冗余废话。" },
              { role: "user", content: prompt }
            ],
            stream: true
          })
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        const reader = resp.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let full = "";
        box.textContent = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");
          for (const line of lines) {
            const tr = line.trim();
            if (tr.startsWith("data: ") && tr !== "data: [DONE]") {
              try {
                const parsed = JSON.parse(tr.slice(6));
                const delta = parsed.choices[0]?.delta?.content || "";
                full += delta;
                box.textContent = full;
              } catch (e) {}
            }
          }
        }
        userStore.aiCache[qKey] = full;
        saveUserStore();
      } catch (err) {
        box.textContent = `AI 解析失败: ${err.message}，请在设置中检查 API Key 与网络连接。`;
      }
    }

    // ==========================================
    // 系统配置模态框
    // ==========================================
    function openSettingsModal() {
      document.getElementById("cfgBaseUrl").value = userStore.settings.baseUrl || "";
      document.getElementById("cfgApiKey").value = userStore.settings.apiKey || "";
      document.getElementById("cfgModel").value = userStore.settings.model || "";
      document.getElementById("settingsModal").classList.add("open");
      closeMoreDropdown();
    }
    function closeSettingsModal() {
      document.getElementById("settingsModal").classList.remove("open");
    }
    function saveSettingsForm() {
      userStore.settings.baseUrl = document.getElementById("cfgBaseUrl").value.trim();
      userStore.settings.apiKey = document.getElementById("cfgApiKey").value.trim();
      userStore.settings.model = document.getElementById("cfgModel").value.trim();
      saveUserStore();
      closeSettingsModal();
      alert("配置保存成功！");
    }

    window.onload = init;
  </script>
