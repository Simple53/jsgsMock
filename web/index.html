<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>file2quiz - 智能刷题与AI解析</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <style>
    /* =========================================
       file2quiz 扁平化设计规范 (No Shadow, No Gradient, No Emoji)
       ========================================= */
    :root {
      --primary: #2563eb;         /* 品牌经典蓝 */
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --correct: #10b981;         /* 翡翠绿 */
      --correct-bg: #ecfdf5;
      --wrong: #ef4444;           /* 珊瑚红 */
      --wrong-bg: #fef2f2;
      --star-active: #f59e0b;     /* 明黄星标 */
      --star-inactive: #e2e8f0;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body.theme-eye {
      --bg: #eef7ee;
      --card-bg: #f7fcf7;
      --text-main: #143818;
      --text-sub: #3d6842;
      --border: #c8e6c9;
      --primary: #15803d;
      --primary-light: #e8f5e9;
      --primary-border: #a5d6a7;
    }

    body.theme-dark {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-light: #1e3a8a;
      --primary-border: #2563eb;
      --correct-bg: #064e3b;
      --wrong-bg: #7f1d1d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .svg-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* 顶部统一 Header */
    .top-brand-header {
      padding: 16px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .brand-actions {
      display: flex;
      gap: 12px;
      color: var(--text-sub);
    }
    .header-icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    /* 主视图容器 */
    .view-content-pane {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      padding-bottom: 70px;
    }

    /* 科目胶囊条 */
    .capsule-nav {
      display: flex;
      gap: 12px;
      padding: 12px 20px;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    .capsule-nav::-webkit-scrollbar { display: none; }
    .capsule-item {
      font-size: 14px;
      color: var(--text-sub);
      cursor: pointer;
      padding-bottom: 4px;
      font-weight: 500;
    }
    .capsule-item.active {
      color: var(--primary);
      font-weight: 700;
      border-bottom: 2.5px solid var(--primary);
    }

    /* 科目卡片列表 (Tab 1) */
    .subject-list {
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .subject-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .sub-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex: 1;
    }
    .sub-bullet-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .sub-bullet-circle svg { width: 12px; height: 12px; }
    .sub-info-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sub-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }
    .sub-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stars-group {
      display: flex;
      gap: 3px;
    }
    .star-icon {
      width: 13px;
      height: 13px;
      fill: var(--star-inactive);
    }
    .star-icon.active {
      fill: var(--star-active);
    }
    .sub-progress-count {
      font-size: 12px;
      color: var(--text-muted);
    }
    .sub-right-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
      padding-left: 8px;
    }

    /* 悬浮自定义刷题入口 */
    .custom-fab-wrap {
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .custom-fab-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      color: var(--text-main);
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .custom-fab-btn:active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 底部 4 栏导航 (练习 | 错题本 | 模拟考试 | 做题历史) */
    .bottom-tabbar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 56px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 30;
    }
    .tabbar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      background: none;
      border: none;
      flex: 1;
    }
    .tabbar-item.active {
      color: var(--primary);
    }
    .tabbar-item svg { width: 20px; height: 20px; }

    /* =========================================
       刷题界面 (包含平铺工具栏与滑动手势)
       ========================================= */
    .quiz-view {
      display: none;
      flex-direction: column;
      flex: 1;
      height: 100vh;
      overflow-y: hidden;
      touch-action: pan-y; /* 允许纵向滚动同时捕捉横向滑动 */
    }
    .quiz-top-nav-flat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      z-index: 25;
    }
    .nav-left-flat {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .quiz-timer {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }
    .nav-tools-tiled {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text-main);
    }
    .tool-icon-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .tool-icon-btn.active {
      color: var(--star-active);
    }

    .quiz-scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 76px;
      user-select: none;
    }
    .quiz-header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .meta-subject-tag {
      font-weight: 700;
      color: var(--text-sub);
    }
    .meta-index-counter {
      font-weight: 800;
      color: var(--text-sub);
    }
    .q-text-body {
      font-size: 17px;
      line-height: 1.65;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-word;
    }

    /* 圆形字母选项行 */
    .quiz-options-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .option-circle-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .option-label-text {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-main);
      flex: 1;
    }

    .option-row.exam-selected {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .option-row.exam-selected .option-circle-letter {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .option-row.status-correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: #065f46;
    }
    .option-row.status-correct .option-circle-letter {
      border-color: var(--correct);
      background: var(--correct);
      color: #ffffff;
    }

    .option-row.status-wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: #991b1b;
    }
    .option-row.status-wrong .option-circle-letter {
      border-color: var(--wrong);
      background: var(--wrong);
      color: #ffffff;
    }

    /* 判断题选项 */
    .judge-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .judge-flat-btn {
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* 官方解析 */
    .fenbi-analysis-box {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: var(--card-bg);
      margin-top: 10px;
    }
    .analysis-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .ans-badge-text {
      color: var(--correct);
      font-size: 16px;
      margin-left: 6px;
    }
    .analysis-detail-body {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-sub);
      white-space: pre-wrap;
    }

    /* AI 深度剖析模块 */
    .ai-stream-box {
      border: 1.5px solid var(--primary-border);
      border-radius: 12px;
      padding: 14px;
      background: var(--card-bg);
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ai-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ai-label-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ai-trigger-btn {
      padding: 6px 14px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .ai-text-container {
      font-size: 14px;
      line-height: 1.7;
      background: var(--primary-light);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--primary-border);
      color: var(--text-main);
      white-space: pre-wrap;
    }

    /* 底部上一题/下一题 */
    .quiz-bottom-actions {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 56px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 25;
    }
    .bottom-btn {
      height: 40px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      padding: 0 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bottom-btn.primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* =========================================
       草稿画板 (支持撤销一步 Undo)
       ========================================= */
    .draft-canvas-mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 120;
      display: none;
      background: rgba(255, 255, 255, 0.88);
      touch-action: none;
    }
    .draft-canvas-mask.open { display: block; }
    #draftCanvas { width: 100%; height: 100%; display: block; }
    .draft-bar-float {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 30px;
      padding: 6px 14px;
      z-index: 130;
    }
    .draft-action-btn {
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .draft-action-btn.danger { color: var(--wrong); }

    /* =========================================
       模态弹窗基础
       ========================================= */
    .modal-mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.45);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-mask.open { display: flex; }
    .modal-panel {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-main-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }
    .modal-close-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .modal-submit-btn {
      padding: 14px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    /* 选项卡切换头 (错题本 & 历史记录) */
    .inner-tab-header {
      display: flex;
      border-bottom: 1.5px solid var(--border);
      margin-bottom: 12px;
    }
    .inner-tab-btn {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      background: none;
      border: none;
      cursor: pointer;
    }
    .inner-tab-btn.active {
      color: var(--primary);
      border-bottom: 2.5px solid var(--primary);
      margin-bottom: -1.5px;
    }

    /* 艾宾浩斯复习指示卡 */
    .ebbinghaus-banner {
      background: var(--primary-light);
      border: 1.5px solid var(--primary-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .ebbinghaus-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
    }
    .ebbinghaus-cycle-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      text-align: center;
      font-size: 11px;
    }
    .cycle-pill {
      background: #ffffff;
      border: 1px solid var(--primary-border);
      padding: 6px 2px;
      border-radius: 6px;
      color: var(--text-sub);
    }

    /* 试卷卡片 (模拟考试) */
    .exam-paper-card {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .exam-paper-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .exam-paper-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 答题卡网格 */
    .sheet-drawer-mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.45);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-drawer-mask.open { display: flex; }
    .sheet-drawer-content {
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sheet-num-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-top: 14px;
      padding-bottom: 20px;
    }
    .sheet-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
    }
    .sheet-cell.current {
      border-color: var(--primary);
      border-width: 2px;
      color: var(--primary);
      background: var(--primary-light);
    }
    .sheet-cell.done {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .sheet-cell.correct {
      background: var(--correct);
      border-color: var(--correct);
      color: #ffffff;
    }
    .sheet-cell.wrong {
      background: var(--wrong);
      border-color: var(--wrong);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- SVG 图标库声明 (严禁 Emoji) -->
  <svg style="display: none;">
    <defs>
      <!-- 返回/叉号 -->
      <g id="icon-close"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <!-- 时钟 -->
      <g id="icon-clock"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
      <!-- 草稿笔 -->
      <g id="icon-pencil"><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L7 20l-4 1 1-4 14.5-14.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <!-- 答题卡 -->

  <script>
    // ==========================================
    // 全局数据结构与持久化
    // ==========================================
    let allSubjectsData = {};
    let currentSubject = "";
    let activeQuestions = [];
    let currentQuizIndex = 0;
    let currentExamId = null; // 当前是否在模拟考试

    let appConfig = {
      quizMode: 'study', // 'study' | 'exam'
      batchSize: 15,
      theme: 'light'
    };

    let userStore = {
      lastSubject: "",
      progress: {},
      answers: {},        // { [qKey]: { chosen, isCorrect, time } }
      favorites: [],
      ebbinghausWrong: {},// { [qKey]: { firstWrongAt, lastReviewAt, reviewCount } }
      savedExams: [],     // [ { id, title, questionKeys, createdAt, completedAt, score } ]
      practiceHistory: [],// [ { subject, count, correctCount, time } ]
      aiCache: {},
      settings: {
        provider: "deepseek",
        baseUrl: "https://api.deepseek.com/v1",
        apiKey: "",
        model: "deepseek-chat"
      }
    };

    let isExamSubmitted = false;
    let timerSeconds = 0;
    let timerInterval = null;

    function getQKey(q) {
      return `${q.subject}_${q.type}_${q.num}`;
    }

    function loadUserStore() {
      const saved = localStorage.getItem("file2quiz_core_store");
      if (saved) {
        try { userStore = { ...userStore, ...JSON.parse(saved) }; } catch (e) {}
      }
      const savedCfg = localStorage.getItem("file2quiz_core_cfg");
      if (savedCfg) {
        try { appConfig = { ...appConfig, ...JSON.parse(savedCfg) }; } catch (e) {}
      }
      applyTheme(appConfig.theme);
    }

    function saveUserStore() {
      localStorage.setItem("file2quiz_core_store", JSON.stringify(userStore));
      localStorage.setItem("file2quiz_core_cfg", JSON.stringify(appConfig));
    }

    // ==========================================
    // 初始化应用
    // ==========================================
    async function init() {
      loadUserStore();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      try {
        const resp = await fetch("quiz_data.json");
        allSubjectsData = await resp.json();
      } catch (e) {
        console.error("加载题库失败", e);
      }

      renderSubjectList();
      initDraftCanvasWithUndo();
      initTouchSwipe();
      renderSavedExams();
    }

    // ==========================================
    // 底部 4 栏切换逻辑
    // ==========================================
    function switchBottomTab(tab) {
      ['panePractice', 'paneWrong', 'paneExam', 'paneHistory'].forEach(id => {
        document.getElementById(id).style.display = 'none';
      });
      ['tabBtnPractice', 'tabBtnWrong', 'tabBtnExam', 'tabBtnHistory'].forEach(id => {
        document.getElementById(id).classList.remove('active');
      });

      if (tab === 'practice') {
        document.getElementById('panePractice').style.display = 'flex';
        document.getElementById('tabBtnPractice').classList.add('active');
        renderSubjectList();
      } else if (tab === 'wrong') {
        document.getElementById('paneWrong').style.display = 'flex';
        document.getElementById('tabBtnWrong').classList.add('active');
        renderWrongPane('all');
      } else if (tab === 'exam') {
        document.getElementById('paneExam').style.display = 'flex';
        document.getElementById('tabBtnExam').classList.add('active');
        renderSavedExams();
      } else if (tab === 'history') {
        document.getElementById('paneHistory').style.display = 'flex';
        document.getElementById('tabBtnHistory').classList.add('active');
        renderHistoryPane('practice');
      }
    }

    // ==========================================
    // TAB 1: 练习 (科目列表)
    // ==========================================
    function renderSubjectList(filter = 'all') {
      const container = document.getElementById("subjectListContainer");
      container.innerHTML = "";

      const subjects = Object.keys(allSubjectsData);
      subjects.forEach((sub) => {
        if (filter === 'theory' && !sub.includes("学") && !sub.includes("论述")) return;
        if (filter === 'law' && !sub.includes("道德") && !sub.includes("法规")) return;

        const qList = allSubjectsData[sub] || [];
        const total = qList.length;

        let answeredCount = 0;
        let correctCount = 0;
        qList.forEach(q => {
          const rec = userStore.answers[getQKey(q)];
          if (rec) {
            answeredCount++;
            if (rec.isCorrect) correctCount++;
          }
        });

        let starLevel = 0;
        if (answeredCount > 0) {
          const rate = correctCount / answeredCount;
          if (rate >= 0.9) starLevel = 5;
          else if (rate >= 0.75) starLevel = 4;
          else if (rate >= 0.6) starLevel = 3;
          else if (rate >= 0.4) starLevel = 2;
          else starLevel = 1;
        }

        let starsHtml = "";
        for (let i = 1; i <= 5; i++) {
          starsHtml += `<svg class="star-icon ${i <= starLevel ? 'active' : ''}"><use href="#icon-star"/></svg>`;
        }

        const card = document.createElement("div");
        card.className = "subject-card";
        card.innerHTML = `
          <div class="sub-left">
            <div class="sub-bullet-circle"><svg><use href="#icon-check"/></svg></div>
            <div class="sub-info-col">
              <div class="sub-name">${sub}</div>
              <div class="sub-meta-row">
                <div class="stars-group">${starsHtml}</div>
                <span class="sub-progress-count">${answeredCount}/${total}</span>
              </div>
            </div>
          </div>
          <div class="sub-right-btn" onclick="startQuizSubject('${sub}', event)">
            <span>继续上次</span>
            <span>›</span>
          </div>
        `;
        card.onclick = () => startQuizSubject(sub);
        container.appendChild(card);
      });
    }

      Object.values(allSubjectsData).forEach(qs => all.push(...qs));

      const sampled = all.slice(0, chosenExamCount);
      const examId = "exam_" + Date.now();
      const newExam = {

    function renderCurrentQuestion() {
      const container = document.getElementById("quizScrollBody");

      const userAnsRec = userStore.answers[qKey];
      const isExam = (appConfig.quizMode === 'exam');
      const showAnswer = isExam ? isExamSubmitted : (userAnsRec !== undefined);

      let optionsHtml = "";
      if (q.type === 'judge') {
        let yesClass = "judge-flat-btn";
        let noClass = "judge-flat-btn";
        if (userAnsRec) {
          if (showAnswer) {
            if (q.answer === '对') yesClass += " status-correct";
            else if (userAnsRec.chosen === '对') yesClass += " status-wrong";
            if (q.answer === '错') noClass += " status-correct";
            else if (userAnsRec.chosen === '错') noClass += " status-wrong";
          } else {
            if (userAnsRec.chosen === '对') yesClass += " exam-selected";
            if (userAnsRec.chosen === '错') noClass += " exam-selected";
          }
        }
        optionsHtml = `
          <div class="judge-btn-grid">
            <button class="${yesClass}" onclick="handleAnswerSelect('对')"><svg class="svg-icon"><use href="#icon-check"/></svg> 正确</button>
            <button class="${noClass}" onclick="handleAnswerSelect('错')"><svg class="svg-icon"><use href="#icon-close"/></svg> 错误</button>
          </div>
        `;
      } else {
        optionsHtml = `<div class="quiz-options-col">`;
        for (const [letter, text] of Object.entries(q.options || {})) {
          let rowClass = "option-row";
          if (userAnsRec) {
            if (showAnswer) {
              if (q.answer.includes(letter)) rowClass += " status-correct";
              else if (userAnsRec.chosen.includes(letter)) rowClass += " status-wrong";
            } else {
              if (userAnsRec.chosen.includes(letter)) rowClass += " exam-selected";
            }
          }
          optionsHtml += `
            <div class="${rowClass}" onclick="handleAnswerSelect('${letter}')">
              <div class="option-circle-letter">${letter}</div>
              <div class="option-label-text">${text}</div>
            </div>
          `;
        }
        optionsHtml += `</div>`;
      }

      let analysisBlock = "";
      if (showAnswer) {
        analysisBlock = `
          <div class="fenbi-analysis-box">
            <div class="analysis-row-top" onclick="toggleAnalysisDetails('${qKey}')">
              <div><span>正确答案</span><span class="ans-badge-text">${q.answer}</span></div>
              <span style="font-size:12px;color:var(--primary);">官方考点精解 ▾</span>

          </div>

          <div class="ai-stream-box">
            <div class="ai-header-bar">
              <div class="ai-label-title">
                <svg class="svg-icon" style="width:16px;height:16px;"><use href="#icon-bot"/></svg>
                <span>AI 名师深度剖析 (${userStore.settings.model || 'AI'})</span>
              </div>
              <button class="ai-trigger-btn" onclick="requestAiHelp()">${userStore.aiCache[qKey] ? '重新精讲' : '一键精讲'}</button>
            </div>
            <div class="ai-text-container" id="aiTextContainer" style="${userStore.aiCache[qKey] ? '' : 'display:none;'}">${userStore.aiCache[qKey] || ''}</div>
          </div>
        `;

      container.innerHTML = `
        <div class="quiz-header-meta">
          <span class="meta-subject-tag">${q.typeName} · ${q.subject}</span>

        nextBtn.textContent = (isExam && !isExamSubmitted) ? "交卷查看" : "完成";

        nextBtn.textContent = "下一题";

    function handleAnswerSelect(ans) {
      const q = activeQuestions[currentQuizIndex];
      const qKey = getQKey(q);

      if (appConfig.quizMode === 'study' && userStore.answers[qKey]) return;

      const isCorrect = (ans === q.answer);
      userStore.answers[qKey] = { chosen: ans, isCorrect, time: Date.now() };

      if (!isCorrect) {
        const now = Date.now();
        if (!userStore.ebbinghausWrong[qKey]) {
          userStore.ebbinghausWrong[qKey] = { firstWrongAt: now, lastReviewAt: now, reviewCount: 0 };
        } else {
          userStore.ebbinghausWrong[qKey].lastReviewAt = now;
          userStore.ebbinghausWrong[qKey].reviewCount += 1;
        }
      }

      saveUserStore();
      renderCurrentQuestion();
    }

    function navigateQuestion(step) {
      const total = activeQuestions.length;
      const target = currentQuizIndex + step;
      if (target >= total) {
        if (appConfig.quizMode === 'exam' && !isExamSubmitted) {
          submitExamPaper();
        } else {
          openSheetDrawer();
        }
        return;
      }
      if (target >= 0 && target < total) {
        currentQuizIndex = target;
        if (currentSubject) userStore.progress[currentSubject] = currentQuizIndex;
        saveUserStore();
        renderCurrentQuestion();
      }
    }

    // ==========================================
    // 左右滑动手势支持 (Touch Swipe)
    // ==========================================
    function initTouchSwipe() {
      let touchStartX = 0, touchStartY = 0;
      const quizView = document.getElementById("quizView");

      quizView.addEventListener("touchstart", (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      quizView.addEventListener("touchend", (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;

        // 横向位移大于50且横向幅度大于纵向幅度
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) navigateQuestion(1);  // 向左滑 -> 下一题
          else navigateQuestion(-1);       // 向右滑 -> 上一题
        }
      }, { passive: true });
    }

    // ==========================================
    // 草稿画板 (带撤销一步 Undo 笔画栈)
    // ==========================================
    let draftCanvas, draftCtx, isDrawing = false;
    let strokes = []; // 笔画数组 [ [ {x, y}, ... ], ... ]
    let currentStroke = [];

    function initDraftCanvasWithUndo() {
      draftCanvas = document.getElementById("draftCanvas");
      draftCtx = draftCanvas.getContext("2d");

      function resize() {
        draftCanvas.width = window.innerWidth;
        draftCanvas.height = window.innerHeight;
        redrawStrokes();
      }
      window.addEventListener("resize", resize);
      resize();

      function getPos(e) {
        const rect = draftCanvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - rect.left, y: t.clientY - rect.top };
      }

      function start(e) {
        isDrawing = true;
        currentStroke = [];
        const p = getPos(e);
        currentStroke.push(p);
        draftCtx.beginPath();
        draftCtx.moveTo(p.x, p.y);
      }
      function draw(e) {
        if (!isDrawing) return;
        const p = getPos(e);
        currentStroke.push(p);
        draftCtx.lineWidth = 2.5;
        draftCtx.lineCap = 'round';
        draftCtx.strokeStyle = '#2563eb';
        draftCtx.lineTo(p.x, p.y);
        draftCtx.stroke();
      }
      function stop() {
        if (!isDrawing) return;
        isDrawing = false;
        if (currentStroke.length > 0) strokes.push(currentStroke);
      }

      draftCanvas.addEventListener("mousedown", start);
      draftCanvas.addEventListener("mousemove", draw);
      draftCanvas.addEventListener("mouseup", stop);

      draftCanvas.addEventListener("touchstart", (e) => { e.preventDefault(); start(e); });
      draftCanvas.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); });
      draftCanvas.addEventListener("touchend", stop);
    }

    function redrawStrokes() {
      if (!draftCtx) return;
      draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
      strokes.forEach(strk => {
        if (strk.length < 2) return;
        draftCtx.beginPath();
        draftCtx.lineWidth = 2.5;
        draftCtx.lineCap = 'round';
        draftCtx.strokeStyle = '#2563eb';
        draftCtx.moveTo(strk[0].x, strk[0].y);
        for (let i = 1; i < strk.length; i++) {
          draftCtx.lineTo(strk[i].x, strk[i].y);
        }
        draftCtx.stroke();
      });
    }

    function undoDraftStroke() {
      if (strokes.length > 0) {
        strokes.pop();
        redrawStrokes();
      }
    }

    function clearDraft() {
      strokes = [];
      redrawStrokes();
    }
    function openDraftCanvas() { document.getElementById("draftCanvasMask").classList.add("open"); }
    function closeDraftCanvas() { document.getElementById("draftCanvasMask").classList.remove("open"); }

    function openSheetDrawer() {

        const cell = document.createElement("div");
        cell.className = "sheet-cell";
        cell.textContent = idx + 1;
        if (idx === currentQuizIndex) cell.classList.add("current");
        if (rec) {
          if (appConfig.quizMode === 'exam' && !isExamSubmitted) cell.classList.add("done");
          else cell.classList.add(rec.isCorrect ? "correct" : "wrong");
        }
        cell.onclick = () => { currentQuizIndex = idx; closeSheetDrawer(); renderCurrentQuestion(); };
        grid.appendChild(cell);
      });
      document.getElementById("submitExamBtn").style.display = (appConfig.quizMode === 'exam' && !isExamSubmitted) ? "block" : "none";
      document.getElementById("sheetDrawer").classList.add("open");
    }
    function closeSheetDrawer() { document.getElementById("sheetDrawer").classList.remove("open"); }

    function submitExamPaper() {
      isExamSubmitted = true;
      closeSheetDrawer();
      let correct = 0;
      activeQuestions.forEach(q => {
        const rec = userStore.answers[getQKey(q)];
        if (rec && rec.isCorrect) correct++;
      });
      const total = activeQuestions.length;
      const score = Math.round((correct / total) * 100);

      // 保存至试卷记录
      if (currentExamId) {
        const ex = userStore.savedExams.find(e => e.id === currentExamId);
        if (ex) ex.score = score;
      }
      saveUserStore();
      renderCurrentQuestion();
      alert(`交卷成功！\n共 ${total} 题，答对 ${correct} 题，得分：${score} 分！\n已切换至全卷答案解析模式。`);
    }

    // ==========================================
    // AI 配置 (多提供商预设 & 自由切换模型)
    // ==========================================
    const PROVIDER_PRESETS = {
      deepseek: {
        baseUrl: "https://api.deepseek.com/v1",
        model: "deepseek-chat",
        models: ["deepseek-chat", "deepseek-reasoner"]
      },
      openai: {
        baseUrl: "https://api.openai.com/v1",
        model: "gpt-4o-mini",
        models: ["gpt-4o-mini", "gpt-4o", "gpt-3.5-turbo"]
      },
      kimi: {
        baseUrl: "https://api.moonshot.cn/v1",
        model: "moonshot-v1-8k",
        models: ["moonshot-v1-8k", "moonshot-v1-32k"]
      },
      siliconflow: {
        baseUrl: "https://api.siliconflow.cn/v1",
        model: "Qwen/Qwen2.5-7B-Instruct",
        models: ["Qwen/Qwen2.5-7B-Instruct", "deepseek-ai/DeepSeek-V2.5"]
      },
      custom: {
        baseUrl: "",
        model: "",
        models: []
      }
    };

    function openSettingsModal() {
      const p = userStore.settings.provider || "deepseek";
      document.getElementById("cfgProvider").value = p;
      document.getElementById("cfgBaseUrl").value = userStore.settings.baseUrl || "";
      document.getElementById("cfgApiKey").value = userStore.settings.apiKey || "";
      document.getElementById("cfgModel").value = userStore.settings.model || "";
      renderQuickModelPills(p);
      document.getElementById("settingsModal").classList.add("open");
    }
    function closeSettingsModal() { document.getElementById("settingsModal").classList.remove("open"); }

    function handleProviderChange(providerKey) {
      const preset = PROVIDER_PRESETS[providerKey];
      if (preset && providerKey !== 'custom') {
        document.getElementById("cfgBaseUrl").value = preset.baseUrl;
        document.getElementById("cfgModel").value = preset.model;
      }
      renderQuickModelPills(providerKey);
    }

    function renderQuickModelPills(providerKey) {
      const container = document.getElementById("quickModelPills");
      container.innerHTML = "";
      const models = PROVIDER_PRESETS[providerKey]?.models || [];
      models.forEach(m => {
        const pill = document.createElement("span");
        pill.className = "cycle-pill";
        pill.style.cursor = "pointer";
        pill.textContent = m;
        pill.onclick = () => { document.getElementById("cfgModel").value = m; };
        container.appendChild(pill);
      });
    }

    function saveSettingsForm() {
      userStore.settings.provider = document.getElementById("cfgProvider").value;
      userStore.settings.baseUrl = document.getElementById("cfgBaseUrl").value.trim();
      userStore.settings.apiKey = document.getElementById("cfgApiKey").value.trim();
      userStore.settings.model = document.getElementById("cfgModel").value.trim();
      saveUserStore();
      closeSettingsModal();
      alert("AI 接口与模型配置已更新！");
    }

    // AI 流式解析调用
    async function requestAiHelp() {
      const q = activeQuestions[currentQuizIndex];
      if (!q) return;
      const qKey = getQKey(q);
      const cfg = userStore.settings;

      if (!cfg.apiKey) {
        alert("请先配置您的 API Key 密钥");
        openSettingsModal();
        return;
      }

      const box = document.getElementById("aiTextContainer");
      box.style.display = "block";
      box.textContent = "连线大模型梳理考点中...";

      const prompt = `你是一位高水平的考试辅导专家。请对以下题目进行深入剖析：
【科目】：${q.subject}
【题型】：${q.typeName}
【题干】：${q.question}
【官方正确答案】：${q.answer}
【官方原解析】：${q.analysis || '无'}

请按三点输出：
1. 【核心考点】：一句话点破考查的核心概念。
2. 【正解与混淆项拆解】：为什么选 ${q.answer}，以及其他选项的陷阱。
3. 【秒记口诀】：给出一句押韵或便于记忆的口诀。`;

      try {
        const endpoint = `${cfg.baseUrl.replace(/\/+$/, "")}/chat/completions`;
        const resp = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${cfg.apiKey}`
          },
          body: JSON.stringify({
            model: cfg.model || "deepseek-chat",
            messages: [
              { role: "system", content: "你是一位专业教育辅导专家，输出内容直击核心，拒绝冗余废话。" },
              { role: "user", content: prompt }
            ],
            stream: true
          })
        });

        if (!resp.ok) throw new Error(`HTTP 错误码 ${resp.status}`);

        const reader = resp.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let full = "";
        box.textContent = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");
          for (const line of lines) {
            const tr = line.trim();
            if (tr.startsWith("data: ") && tr !== "data: [DONE]") {
              try {
                const parsed = JSON.parse(tr.slice(6));
                const delta = parsed.choices[0]?.delta?.content || "";
                full += delta;
                box.textContent = full;
              } catch (e) {}
            }
          }
        }
        userStore.aiCache[qKey] = full;
        saveUserStore();
      } catch (err) {
        box.textContent = `AI 解析失败: ${err.message}，请在右上角 AI 配置中检查 Key 与地址。`;
      }
    }

    // 自定义弹窗
    function openCustomModal() { document.getElementById("customModal").classList.add("open"); }
    function closeCustomModal() { document.getElementById("customModal").classList.remove("open"); }
    function selectQuizMode(m) {
      appConfig.quizMode = m;
      document.getElementById("cardModeExam").classList.toggle("active", m === 'exam');
      document.getElementById("cardModeStudy").classList.toggle("active", m === 'study');
    }
    function selectBatchSize(s, el) {
      appConfig.batchSize = s;
      document.querySelectorAll(".count-pill").forEach(p => p.classList.remove("active"));
      el.classList.add("active");
    }
    function confirmStartCustomQuiz() {
      saveUserStore();
      closeCustomModal();
      const firstSub = currentSubject || Object.keys(allSubjectsData)[0];
      startQuizSubject(firstSub);
    }
    function toggleAnalysisDetails(qKey) {
      const el = document.getElementById(`analysisDetail_${qKey}`);
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    window.onload = init;
  </script>
</body>
