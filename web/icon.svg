<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 纯扁平·粉笔蓝背景·无渐变·无阴影 -->
  <rect width="512" height="512" rx="112" fill="#2563eb" />
  <!-- 书卷/题卡主体 (纯白) -->
  <path d="M120 130 C120 130, 190 110, 256 150 C322 110, 392 130, 392 130 L392 370 C392 370, 322 350, 256 390 C190 350, 120 370, 120 370 Z" fill="#ffffff" />
  <!-- 书脊中央分割线 -->
  <line x1="256" y1="150" x2="256" y2="390" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
  <!-- 左页横线象征题文 -->
  <line x1="160" y1="210" x2="225" y2="210" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" />
  <line x1="160" y1="260" x2="225" y2="260" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" />
  <line x1="160" y1="310" x2="200" y2="310" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" />
  <!-- 右页对勾象征满分通过 (纯正绿) -->
  <polyline points="295,265 330,300 375,215" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
</svg>
