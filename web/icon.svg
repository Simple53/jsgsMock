<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 纯扁平·极简品牌蓝背景·无渐变·无阴影 -->
  <rect width="512" height="512" rx="112" fill="#2563eb" />
  
  <!-- 左侧代表 File (带折角的文件文档) -->
  <path d="M120 150 L200 150 L240 190 L240 370 L120 370 Z" fill="#ffffff" />
  <path d="M200 150 L200 190 L240 190 Z" fill="#bfdbfe" />
  <!-- 文件内部文本线 -->
  <line x1="145" y1="230" x2="215" y2="230" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />
  <line x1="145" y1="270" x2="215" y2="270" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />
  <line x1="145" y1="310" x2="190" y2="310" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />

  <!-- 中间转换箭头 (File -> Quiz) -->
  <path d="M255 260 L280 260 M272 250 L282 260 L272 270" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 右侧代表 Quiz (答卷与通过勾选) -->
  <rect x="295" y="150" width="105" height="220" rx="10" fill="#ffffff" />
  <!-- 选项与勾选 -->
  <circle cx="325" cy="210" r="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="4" />
  <line x1="345" y1="210" x2="380" y2="210" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
  <circle cx="325" cy="260" r="10" fill="#10b981" />
  <!-- 对勾 -->
  <polyline points="320,260 324,264 331,256" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="345" y1="260" x2="380" y2="260" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <circle cx="325" cy="310" r="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="4" />
  <line x1="345" y1="310" x2="370" y2="310" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
</svg>
